name: cityclean-demo

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DEEPSEEK_API_KEY
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_TIANDITU_KEY: ${VITE_TIANDITU_KEY:-}
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
