[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cityclean-agent"
version = "0.1.0"
description = "Autonomous assessment and dynamic dispatch agent for urban sanitation incidents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135,<1",
    "langchain-deepseek>=1,<2",
    "ortools>=9.10,<10",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.40,<2",
    "uvicorn>=0.46,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
